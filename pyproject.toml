[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength-checker"
version = "1.0.0"
description = "Offline password strength scoring and a privacy-preserving data breach check"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tasmia Taskin Mubassira" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
password-checker = "password_checker.cli:main"

[tool.setuptools.package-data]
password_checker = ["common_passwords.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the package straight from the project folder (no install needed).
pythonpath = ["."]
